name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend — pytest + coverage
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Run tests with coverage
        env:
          ENV: test
          SECRET_KEY: ci_test_secret_key_not_for_production
          REFRESH_SECRET_KEY: ci_test_refresh_secret_key_not_for_production
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-omit="tests/*,venv/*,.venv/*,*/__pycache__/*" \
            --tb=short \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ──────────────────────────────────────────────────────────────────────────
  # Backend — lint
  # ──────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (flake8)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 . \
            --exclude=venv,.venv,__pycache__,migrations \
            --max-line-length=120 \
            --ignore=E501,W503 \
            --count

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend — build check
  # ──────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_URL: http://localhost:8000
          CI: false        # treat warnings as warnings, not errors
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Summary gate — all jobs must pass for a PR to merge
  # ──────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, frontend-build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.backend-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed ✅"
